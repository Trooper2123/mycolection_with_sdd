version: '3.8'

services:
  # Backend Java - API Principal
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mycolection-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger-ui/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mycolection-network

  # BFF - Proxy Layer
  bff:
    build:
      context: ./
      dockerfile: ./bff/Dockerfile
    container_name: mycolection-bff
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      CORE_API_BASE_URL: http://backend:8080
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/swagger-ui/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mycolection-network

  # Frontend Angular (opcional - geralmente rodado via npm start)
  # frontend:
  #   image: node:22-alpine
  #   container_name: mycolection-frontend
  #   working_dir: /app
  #   volumes:
  #     - ./frontend:/app
  #   ports:
  #     - "4200:4200"
  #   command: npm run start
  #   environment:
  #     API_URL: http://localhost:8081
  #   depends_on:
  #     - bff
  #   networks:
  #     - mycolection-network

networks:
  mycolection-network:
    driver: bridge

