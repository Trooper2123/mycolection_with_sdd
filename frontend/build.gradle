plugins {
    id 'com.github.node-gradle.node' version '7.0.1'
}

group = 'br.com.acervo'
version = '0.1.1'

node {
    version = '20.10.0'
    download = true
}

task buildFrontend(type: NpmTask) {
    args = ['run', 'build']
}

// Ensure a 'build' task exists for Gradle aggregation (frontend has no java plugin)
tasks.register('build') {
    dependsOn buildFrontend
}
