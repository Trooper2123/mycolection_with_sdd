// Arquivo de build raiz para configurar repositórios e configurações compartilhadas
plugins {
    // plugin leve apenas para permitir tarefas de build agregadas
    id 'base'
}

allprojects {
    repositories {
        mavenCentral()
    }
}

// Configurações que podem ser aplicadas a subprojetos se necessário
subprojects {
    // garante encoding consistente
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

// Tarefa auxiliar para construir todos os subprojetos explicitamente
tasks.register('buildAll') {
    description = 'Build de todos os subprojetos (backend e frontend).'
    group = 'build'
    dependsOn subprojects.collect { p -> p.tasks.matching { it.name == 'build' } }
}
